name: Deploy Neukee Site to GitHub Pages

on:
  push:
    branches: [main]
  # Every pull request (including Dependabot's) gets the full build, so a broken
  # update is caught before it reaches main. Only main deploys.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deployment at a time; pull request builds don't wait behind deployments.
  group: ${{ github.event_name == 'pull_request' && format('build-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0 (pins its inner upload-artifact by SHA)
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    # The same permissions the deploy had before, now scoped to this job only.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
