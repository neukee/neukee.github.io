version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Major versions (Tailwind 4, TypeScript 7, ...) need a deliberate migration,
    # not a weekly pull request. Minor and patch updates still arrive.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
